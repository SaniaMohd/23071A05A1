name: Student API CI/CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
          tags: ${{ secrets.DOCKER_USERNAME != '' && format('{0}/student-api:latest', secrets.DOCKER_USERNAME) || 'student-api:latest' }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v1
        if: ${{ github.event_name == 'push' && secrets.KUBE_CONFIG != '' }}
        with:
          version: 'latest'

      - name: Configure kubeconfig
        if: ${{ github.event_name == 'push' && secrets.KUBE_CONFIG != '' }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"

      - name: Deploy to Kubernetes
        if: ${{ github.event_name == 'push' && secrets.KUBE_CONFIG != '' }}
        run: |  
          kubectl apply -f deployment.yaml
          kubectl apply -f services.yaml