apiVerison: apps/v1
kind: Deployment

metadata:
  name: student-api-deployment
  labels:
    app: student-api

    spec:
    replicas: 1
    selector:
      matchLabels:
        app: student-api
    template:

      metadata:
        labels:
          app: student-api
      spec:
        containers:
          - name: student-api
            image: student-api:latest
            ports:
              - containerPort: 3000
                protocol: TCP 